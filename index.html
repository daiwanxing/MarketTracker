<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>588170 科创半导体ETF华夏 · MarketTracker</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1221;
      --fg: #f5f7ff;
      --muted: #a8b0c8;
      --line: rgba(255, 255, 255, 0.12);
      --card: rgba(255, 255, 255, 0.04);
      --accent: #7aa2ff;
      --up: #ff5d73;
      --down: #3dce8a;
      --flat: #a8b0c8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Display", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(122, 162, 255, 0.22), transparent 36%),
        radial-gradient(circle at 90% 20%, rgba(156, 120, 255, 0.16), transparent 32%),
        var(--bg);
      color: var(--fg);
    }
    .wrap {
      width: min(1080px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 3rem;
    }
    header h1 {
      margin: 0.35rem 0 0.4rem;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: 0.01em;
    }
    header h1 span {
      color: var(--accent);
      font-weight: 650;
    }
    .eyebrow, .note, .meta, th {
      color: var(--muted);
    }
    .eyebrow {
      margin: 0;
      font-size: 0.92rem;
      letter-spacing: 0.04em;
    }
    .note {
      margin: 0.8rem 0 0;
      max-width: 46rem;
      line-height: 1.6;
    }
    .panel, .table-card {
      margin-top: 1.25rem;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
    }
    .panel { padding: 1.25rem 1.3rem 1.1rem; }
    .status {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0.22rem 0.7rem;
      font-size: 0.85rem;
      border: 1px solid transparent;
    }
    .status.live {
      color: #d9ffe8;
      background: rgba(61, 206, 138, 0.14);
      border-color: rgba(61, 206, 138, 0.35);
    }
    .status.closed {
      color: #ffe6b8;
      background: rgba(255, 196, 92, 0.12);
      border-color: rgba(255, 196, 92, 0.32);
    }
    .price-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1.4rem;
      align-items: baseline;
      margin-top: 0.85rem;
    }
    .price {
      font-size: clamp(2.4rem, 7vw, 3.6rem);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      line-height: 1;
    }
    .change {
      font-size: 1.25rem;
      font-variant-numeric: tabular-nums;
    }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .flat { color: var(--flat); }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
      gap: 0.75rem;
      margin: 1.1rem 0 0;
    }
    .stats div {
      padding: 0.75rem 0.8rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .stats dt {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .stats dd {
      margin: 0.28rem 0 0;
      font-size: 1.05rem;
      font-variant-numeric: tabular-nums;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: baseline;
      margin: 1.6rem 0 0.7rem;
    }
    .section-head h2 {
      margin: 0;
      font-size: 1.15rem;
    }
    .table-card { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }
    th, td {
      padding: 0.75rem 0.85rem;
      text-align: right;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    th:first-child, td:first-child,
    th:nth-child(2), td:nth-child(2),
    th:nth-child(3), td:nth-child(3) {
      text-align: left;
    }
    th { font-weight: 600; font-size: 0.82rem; }
    td.status-cell { white-space: normal; min-width: 14rem; }
    tbody tr:last-child td { border-bottom: 0; }
    .empty, .error {
      margin: 0;
      padding: 1.2rem 1.3rem;
      color: var(--muted);
    }
    footer {
      margin-top: 1.2rem;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">上交所 · 588170</p>
      <h1><span>588170</span> 科创半导体ETF华夏</h1>
      <p class="note">华夏上证科创板半导体材料设备主题ETF。每 5 分钟由 GitHub Actions 追加一条快照。休市也会记录，状态会写明这是最近可得报价或收盘价。历史最新在上，<code>snapshots.json</code> 按时间从早到晚保存。时间均为北京时间（Asia/Shanghai）。</p>
    </header>

    <section class="panel" id="latest" aria-live="polite">
      <p class="meta">正在读取记录…</p>
    </section>

    <div class="section-head">
      <h2>历史快照</h2>
      <p class="meta" id="count"></p>
    </div>
    <div class="table-card" id="history">
      <p class="empty">正在读取记录…</p>
    </div>

    <footer>
      最新价来自交易所行情；实时参考净值（IOPV）来自行情附加字段；单位净值是基金最近一个公布日的官方净值，通常不是盘中价格。数据仅作记录，不构成投资建议。
    </footer>
  </div>
  <noscript><p class="empty">需要启用 JavaScript 才能读取 snapshots.json。</p></noscript>
  <script>
    const latestEl = document.getElementById("latest");
    const historyEl = document.getElementById("history");
    const countEl = document.getElementById("count");

    function text(value) {
      return value === null || value === undefined || value === "" ? "—" : String(value);
    }

    function fmtPrice(value, digits) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return "—";
      return Number(value).toFixed(digits);
    }

    function fmtPct(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return "—";
      const number = Number(value);
      const sign = number > 0 ? "+" : "";
      return sign + number.toFixed(2) + "%";
    }

    function tone(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value)) || Number(value) === 0) return "flat";
      return Number(value) > 0 ? "up" : "down";
    }

    function clock(iso) {
      if (!iso) return "—";
      return iso.replace("T", " ").replace(/([+-]\d{2}:\d{2}|Z)$/, "");
    }

    function statusClass(status) {
      return String(status || "").startsWith("交易中") ? "live" : "closed";
    }

    function stat(label, value) {
      const wrap = document.createElement("div");
      const term = document.createElement("dt");
      const desc = document.createElement("dd");
      term.textContent = label;
      desc.textContent = value;
      wrap.append(term, desc);
      return wrap;
    }

    function renderLatest(row) {
      latestEl.replaceChildren();
      if (!row) {
        const message = document.createElement("p");
        message.className = "meta";
        message.textContent = "还没有快照。工作流运行后，这里会显示 588170 的最新一条记录。";
        latestEl.append(message);
        return;
      }
      const badge = document.createElement("span");
      badge.className = "status " + statusClass(row.market_status);
      badge.textContent = text(row.market_status);

      const priceRow = document.createElement("div");
      priceRow.className = "price-row";
      const price = document.createElement("div");
      price.className = "price " + tone(row.change_pct);
      price.textContent = fmtPrice(row.price, 3);
      const change = document.createElement("div");
      change.className = "change " + tone(row.change_pct);
      const amount = row.change_amt === null || row.change_amt === undefined
        ? "—"
        : (Number(row.change_amt) > 0 ? "+" : "") + Number(row.change_amt).toFixed(3);
      change.textContent = amount + "  " + fmtPct(row.change_pct);
      priceRow.append(price, change);

      const when = document.createElement("p");
      when.className = "meta";
      when.textContent = "记录于 " + clock(row.timestamp) + " · 行情时间 " + clock(row.quote_time);

      const stats = document.createElement("dl");
      stats.className = "stats";
      [
        ["最新价", fmtPrice(row.price, 3)],
        ["涨跌幅", fmtPct(row.change_pct)],
        ["实时参考净值", fmtPrice(row.iopv, 4)],
        ["溢价率", fmtPct(row.premium_pct)],
        ["单位净值", fmtPrice(row.nav, 4)],
        ["净值日期", text(row.nav_date)],
        ["净值涨跌幅", fmtPct(row.nav_change_pct)],
        ["昨收", fmtPrice(row.prev_close, 3)],
        ["今开", fmtPrice(row.open, 3)],
        ["最高", fmtPrice(row.high, 3)],
        ["最低", fmtPrice(row.low, 3)]
      ].forEach(function (pair) {
        stats.append(stat(pair[0], pair[1]));
      });

      latestEl.append(badge, priceRow, when, stats);
    }

    function cell(value, className) {
      const item = document.createElement("td");
      item.textContent = value;
      if (className) item.className = className;
      return item;
    }

    function renderHistory(rows) {
      countEl.textContent = rows.length ? "共 " + rows.length + " 条 · 最新在上" : "";
      historyEl.replaceChildren();
      if (!rows.length) {
        const message = document.createElement("p");
        message.className = "empty";
        message.textContent = "还没有历史记录。";
        historyEl.append(message);
        return;
      }
      const table = document.createElement("table");
      const head = document.createElement("thead");
      const headRow = document.createElement("tr");
      ["记录时间", "行情时间", "状态", "最新价", "涨跌幅", "实时参考净值", "单位净值", "净值日期"].forEach(function (label) {
        const item = document.createElement("th");
        item.textContent = label;
        headRow.append(item);
      });
      head.append(headRow);
      const body = document.createElement("tbody");
      rows.forEach(function (row) {
        const line = document.createElement("tr");
        line.append(
          cell(clock(row.timestamp)),
          cell(clock(row.quote_time)),
          cell(text(row.market_status), "status-cell"),
          cell(fmtPrice(row.price, 3), tone(row.change_pct)),
          cell(fmtPct(row.change_pct), tone(row.change_pct)),
          cell(fmtPrice(row.iopv, 4)),
          cell(fmtPrice(row.nav, 4)),
          cell(text(row.nav_date))
        );
        body.append(line);
      });
      table.append(head, body);
      historyEl.append(table);
    }

    function fail(message) {
      latestEl.replaceChildren();
      historyEl.replaceChildren();
      const latest = document.createElement("p");
      latest.className = "error";
      latest.textContent = message;
      const history = document.createElement("p");
      history.className = "error";
      history.textContent = message;
      latestEl.append(latest);
      historyEl.append(history);
    }

    async function load() {
      try {
        const response = await fetch("snapshots.json?t=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        const rows = (data.snapshots || []).slice().reverse();
        renderLatest(rows[0]);
        renderHistory(rows);
      } catch (error) {
        fail("暂时读不到 snapshots.json。");
      }
    }

    load();
  </script>
</body>
</html>
