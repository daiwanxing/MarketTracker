name: Refresh oil timeline

on:
  schedule:
    # 00:20 and 12:20 UTC = 08:20 and 20:20 Asia/Shanghai (staggered).
    - cron: "20 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-oil-timeline
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh oil timeline
        env:
          DS_API_KEY: ${{ secrets.DS_API_KEY }}
        run: python3 scripts/refresh_oil_timeline.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/oilData.json
          if git diff --cached --quiet; then
            echo "No oil timeline changes to commit"
            exit 0
          fi
          git commit -m "Refresh oil market timeline"
          git pull --rebase origin main
          git push origin HEAD:main
