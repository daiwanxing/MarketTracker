name: Refresh market data

on:
  schedule:
    # Every hour (UTC). GitHub may delay scheduled runs.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh oil and gold quotes
        run: python3 scripts/refresh_market_data.py

      - name: Refresh tech semi quotes
        run: python3 scripts/refresh_tech_semi_data.py

      - name: Refresh oil narrative when the quote moves
        env:
          DS_API_KEY: ${{ secrets.DS_API_KEY }}
        run: |
          set -euo pipefail
          if python3 - << 'PY'
          import json, subprocess, sys
          old = json.loads(subprocess.check_output(["git", "show", "HEAD:src/data/oilData.json"]))
          new = json.load(open("src/data/oilData.json", encoding="utf-8"))
          def quote(doc):
              main = doc.get("metrics", {}).get("main", {})
              quotes = main.get("quotes") or {}
              return (main.get("num"), main.get("chg"), quotes.get("wti"), quotes.get("dxy"))
          sys.exit(0 if quote(old) != quote(new) else 1)
          PY
          then
            python3 scripts/refresh_oil_timeline.py
          else
            echo "Oil quote unchanged; narrative left for the scheduled pass"
          fi

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/oilData.json src/data/goldData.json src/data/techSemiData.json
          if git diff --cached --quiet; then
            echo "No market data changes to commit"
            exit 0
          fi
          git commit -m "Refresh oil, gold and tech semi market numbers"
          git push origin HEAD:main
