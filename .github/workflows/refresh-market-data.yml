name: Refresh market data

on:
  schedule:
    # Every 3 hours, UTC. GitHub may delay scheduled runs.
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh oil and gold quotes
        run: python3 scripts/refresh_market_data.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/oilData.json src/data/goldData.json
          if git diff --cached --quiet; then
            echo "No market data changes to commit"
            exit 0
          fi
          git commit -m "Refresh oil and gold market numbers"
          git push origin HEAD:main
