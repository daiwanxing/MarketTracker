name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A data commit pushed with the default GITHUB_TOKEN does not fire `push`.
  # Rebuilding when the refresh workflow finishes publishes the new numbers.
  workflow_run:
    workflows: ["Refresh market data", "Refresh ENSO numbers", "Refresh tech semi crowding"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run checks out the workflow file's ref, which can lag the
          # data commit just pushed to main. Always build current main.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_BASE: /MarketTracker/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages is still "Deploy from a branch" until someone switches Source
      # to GitHub Actions (this token cannot change that setting). That branch
      # publish starts on the same push and overwrites an earlier Actions
      # deploy. Wait it out when the source is not already Actions.
      - name: Wait out branch Pages publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_type="$(gh api "repos/${{ github.repository }}/pages" --jq .build_type || echo unknown)"
          echo "pages build_type=${build_type}"
          if [ "${build_type}" != "workflow" ]; then
            echo "Branch publish can replace this deploy. Waiting 90s."
            sleep 90
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
