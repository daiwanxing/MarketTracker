name: Refresh tech semi crowding

on:
  schedule:
    # Weekdays (Mon-Fri) ~15:30 Shanghai time (07:30 UTC), after A-share market close.
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-tech-semi-crowding
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh A-share TMT crowding numbers
        run: python3 scripts/refresh_tech_semi_crowding.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/techSemiData.json
          if git diff --cached --quiet; then
            echo "No tech semi crowding changes to commit"
            exit 0
          fi
          git commit -m "Refresh A-share TMT crowding numbers (Phase 2 MVP)"
          git push origin HEAD:main
